spring.application.name=salary
server.port=${PORT:8081}
# Database: defaults for local dev, overridden by env vars in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/salary}
spring.datasource.username=${DB_USERNAME:acme}
spring.datasource.password=${DB_PASSWORD:acme}

# Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false